name: Deploy docs
on:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: '23 6 * * *'
env:
  SITE_BASE_URL: https://akm.fwdslsh.dev/
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: itlackey/akm
          ref: main
          path: upstream/akm
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile
      - name: Import upstream AKM documentation
        run: bun run import:docs
        env:
          AKM_DOCS_DIR: upstream/akm/docs
      - name: Verify build without publishing
        run: bunx unify build --base-url "$SITE_BASE_URL" --dry-run
      - name: Build documentation
        run: bunx unify build --base-url "$SITE_BASE_URL" --clean
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
